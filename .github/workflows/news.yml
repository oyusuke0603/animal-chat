name: Update news
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/fetch_news.py
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add news.json
          git diff --cached --quiet || (git commit -m "Update news" && git push)
